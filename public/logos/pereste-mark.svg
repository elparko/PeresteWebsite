<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 104" role="img" aria-labelledby="title desc">
  <title id="title">Pereste Health logo</title>
  <desc id="desc">Lighthouse with twin light beams and a winding path of four stepping stones leading toward the viewer.</desc>
  <!-- Beams -->
  <polygon points="40,18.5 2,7.5 2,29.5" fill="#7BC9D6"/>
  <polygon points="60,18.5 98,7.5 98,29.5" fill="#7BC9D6"/>
  <!-- Lighthouse -->
  <polygon points="50,6 41,15 59,15" fill="#3F518F"/>
  <rect x="43" y="15" width="14" height="7" fill="#3F518F"/>
  <circle cx="50" cy="18.5" r="2.5" fill="#FFFFFF"/>
  <rect x="39" y="22" width="22" height="3.5" rx="1.7" fill="#3F518F"/>
  <polygon points="44,25.5 56,25.5 60,62 40,62" fill="#3F518F"/>
  <rect x="35" y="62" width="30" height="4" rx="2" fill="#3F518F"/>
  <!-- Winding path: far to near -->
  <ellipse cx="46" cy="71" rx="4" ry="2" fill="#8CCFDB"/>
  <ellipse cx="55" cy="80" rx="5.5" ry="2.7" fill="#0F9BA8"/>
  <ellipse cx="45" cy="89" rx="7" ry="3.4" fill="#0F9BA8"/>
  <ellipse cx="54" cy="99" rx="8.5" ry="4.2" fill="#3F518F"/>
</svg>
